[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pysino"
version = "1.0.0"
description = "A chip-based casino arcade in pygame: blackjack, hold'em, slots, mines, roulette, video poker and crash."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pygame-ce>=2.4"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
pysino = "pysino.__main__:main"

[tool.setuptools.packages.find]
include = ["pysino*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
